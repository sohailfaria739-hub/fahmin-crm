const money = (n) => (n ? 'PKR ' + Number(n).toLocaleString() : '—');
const todayISO = () => new Date().toISOString().slice(0, 10);
const daysFrom = (iso) => {
  if (!iso) return 0;
  const d = new Date(iso + 'T00:00:00');
  const t = new Date(todayISO() + 'T00:00:00');
  return Math.round((d - t) / 86400000);
};

// ─────────────────────────────────────────────────────────────
//  API CLIENT — talks to the real Express + SQLite backend
// ─────────────────────────────────────────────────────────────
const API_BASE = '/api';

function apiRequest(path, { method = 'GET', body, token } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  return fetch(API_BASE + path, {
    method,
    headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  }).then(async (res) => {
    let payload = null;
    try { payload = await res.json(); } catch (e) {}
    if (!res.ok) {
      const message = (payload && payload.error) || `Request failed (${res.status})`;
      throw new Error(message);
    }
    return payload;
  });
}

const api = {
  signup: (data) => apiRequest('/auth/signup', { method: 'POST', body: data }),
  login: (data) => apiRequest('/auth/login', { method: 'POST', body: data }),
  me: (token) => apiRequest('/auth/me', { token }),
  all: (token) => apiRequest('/all', { token }),
  createContact: (token, body) => apiRequest('/contacts', { method: 'POST', body, token }),
  updateContact: (token, id, body) => apiRequest('/contacts/' + id, { method: 'PUT', body, token }),
  deleteContact: (token, id) => apiRequest('/contacts/' + id, { method: 'DELETE', token }),
  createProperty: (token, body) => apiRequest('/properties', { method: 'POST', body, token }),
  updateProperty: (token, id, body) => apiRequest('/properties/' + id, { method: 'PUT', body, token }),
  deleteProperty: (token, id) => apiRequest('/properties/' + id, { method: 'DELETE', token }),
  createDeal: (token, body) => apiRequest('/deals', { method: 'POST', body, token }),
  updateDeal: (token, id, body) => apiRequest('/deals/' + id, { method: 'PUT', body, token }),
  deleteDeal: (token, id) => apiRequest('/deals/' + id, { method: 'DELETE', token }),
  createTask: (token, body) => apiRequest('/tasks', { method: 'POST', body, token }),
  updateTask: (token, id, body) => apiRequest('/tasks/' + id, { method: 'PUT', body, token }),
  deleteTask: (token, id) => apiRequest('/tasks/' + id, { method: 'DELETE', token }),
  activities: (token) => apiRequest('/activities', { token }),
  markActivityRead: (token, id) => apiRequest('/activities/' + id + '/read', { method: 'PUT', token }),
  markAllActivitiesRead: (token) => apiRequest('/activities/read-all', { method: 'PUT', token }),
  deleteActivity: (token, id) => apiRequest('/activities/' + id, { method: 'DELETE', token }),
  updateProfile: (token, body) => apiRequest('/auth/profile', { method: 'PUT', body, token }),
  changePassword: (token, body) => apiRequest('/auth/password', { method: 'PUT', body, token }),
  createCall: (token, body) => apiRequest('/calls', { method: 'POST', body, token }),
  updateCall: (token, id, body) => apiRequest('/calls/' + id, { method: 'PUT', body, token }),
  deleteCall: (token, id) => apiRequest('/calls/' + id, { method: 'DELETE', token }),
  conversations: (token) => apiRequest('/conversations', { token }),
  thread: (token, contactId) => apiRequest('/conversations/' + contactId, { token }),
  sendMessage: (token, contactId, body) => apiRequest('/conversations/' + contactId, { method: 'POST', body, token }),
  getSettings: (token) => apiRequest('/settings', { token }),
  updateSettings: (token, body) => apiRequest('/settings', { method: 'PUT', body, token }),
  askAssistant: (token, message) => apiRequest('/assistant/ask', { method: 'POST', body: { message }, token }),
};

const AuthContext = createContext(null);
const useAuth = () => useContext(AuthContext);

// ─────────────────────────────────────────────────────────────
//  AUTH PROVIDER — persists session token in localStorage
// ─────────────────────────────────────────────────────────────
function AuthProvider({ children }) {
  const [token, setToken] = useState(() => localStorage.getItem('fahmin_token'));
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    if (!token) { setChecking(false); return; }
    api.me(token)
      .then((res) => { setUser(res.user); setChecking(false); })
      .catch(() => { localStorage.removeItem('fahmin_token'); setToken(null); setUser(null); setChecking(false); });
  }, [token]);

  const login = async (email, password) => {
    const res = await api.login({ email, password });
    localStorage.setItem('fahmin_token', res.token);
    setToken(res.token);
    setUser(res.user);
  };
  const signup = async (name, email, password, agency) => {
    const res = await api.signup({ name, email, password, agency });
    localStorage.setItem('fahmin_token', res.token);
    setToken(res.token);
    setUser(res.user);
  };
  const logout = () => {
    localStorage.removeItem('fahmin_token');
    setToken(null);
    setUser(null);
  };

  return (
    <AuthContext.Provider value={{ token, user, checking, login, signup, logout, setUser }}>
      {children}
    </AuthContext.Provider>
  );
}

// ─────────────────────────────────────────────────────────────
//  AUTH SCREEN — sign in / sign up
// ─────────────────────────────────────────────────────────────
function AuthScreen() {
  const { login, signup } = useAuth();
  const [mode, setMode] = useState('login'); // 'login' | 'signup'
  const [form, setForm] = useState({ name: '', email: '', password: '', agency: '' });
  const [error, setError] = useState('');

  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

    e.preventDefault();
    setError('');
    if (!form.email || !form.password) return setError('Email and password are required.');
    if (mode === 'signup' && !form.name.trim()) return setError('Please enter your full name.');
    setLoading(true);
    try {
      if (mode === 'login') await login(form.email, form.password);
      else await signup(form.name, form.email, form.password, form.agency);

      setError(err.message || 'Something went wrong.');
    } finally {

    }

      minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px 12px',

      <div style={{

          <div style={{ position: 'relative', zIndex: 1 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
              <FahminMark size={26} />
              <span style={{ fontFamily: 'Fraunces, serif', color: '#F6F3EC', fontSize: 21, fontWeight: 600 }}>Fahmin</span>
            </div>
            <div style={{ fontSize: 12, color: SLATE, marginTop: 4, letterSpacing: 0.4, textTransform: 'uppercase' }}>Real Estate CRM</div>
          </div>
          <div style={{ position: 'relative', zIndex: 1 }}>
            <div style={{ fontFamily: 'Fraunces, serif', fontSize: 27, lineHeight: 1.25, color: '#F6F3EC', fontWeight: 500 }}>
              Every lead, listing, and deal — in one command center.
            </div>
            <p style={{ color: SLATE, fontSize: 13.5, marginTop: 14, lineHeight: 1.6 }}>
              Track your pipeline from first call to closed deal, manage your listings, and never miss a follow-up.
            </p>
          </div>
          <div style={{ display: 'flex', gap: 18, position: 'relative', zIndex: 1 }}>
            <div><div style={{ color: JADE, fontFamily: 'Fraunces, serif', fontSize: 20, fontWeight: 600 }}>Pipeline</div><div style={{ color: MUTED, fontSize: 11 }}>Kanban deal tracking</div></div>
            <div><div style={{ color: GOLD, fontFamily: 'Fraunces, serif', fontSize: 20, fontWeight: 600 }}>Listings</div><div style={{ color: MUTED, fontSize: 11 }}>Property management</div></div>
          </div>
        </div>

        {/* Right — form panel */}
        <div style={{ flex: '1 1 60%', background: SURFACE, padding: '40px 40px', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
          <div style={{ maxWidth: 340, margin: '0 auto', width: '100%' }}>
            <h1 style={{ fontFamily: 'Fraunces, serif', fontSize: 26, fontWeight: 600, color: INK, marginBottom: 4 }}>
              {mode === 'login' ? 'Welcome back' : 'Create your account'}
            </h1>
            <p style={{ color: SLATE, fontSize: 13, marginBottom: 24 }}>
              {mode === 'login' ? 'Sign in to your Fahmin workspace.' : 'Set up your CRM workspace in seconds.'}
            </p>

            <form onSubmit={submit}>
              {mode === 'signup' && (
                <div style={{ marginBottom: 14 }}>
                  <label style={authLabel}>Full name</label>
                  <input style={authInput} value={form.name} onChange={set('name')} placeholder="e.g. Zohaib Ahmed" autoComplete="name" />
                </div>
              )}
              <div style={{ marginBottom: 14 }}>
                <label style={authLabel}>Email</label>
                <input style={authInput} type="email" value={form.email} onChange={set('email')} placeholder="you@agency.com" autoComplete="email" />
              </div>
              {mode === 'signup' && (

                  <input style={authInput} value={form.agency} onChange={set('agency')} placeholder="e.g. Fahmin Realty" />
                </div>

              ) : (

              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Toast({ message, kind, onClose }) {
  useEffect(() => {
    const t = setTimeout(onClose, 3200);
    return () => clearTimeout(t);
  }, [message]);
  if (!message) return null;
  const color = kind === 'error' ? RUST : JADE;
  const bg = kind === 'error' ? RUST_LIGHT : JADE_LIGHT;
  return (
    <div style={{
      position: 'fixed', bottom: 20, right: 20, background: bg, color, border: `1px solid ${color}33`,
      padding: '11px 16px', borderRadius: 10, fontSize: 13, fontWeight: 600, zIndex: 100,
      boxShadow: '0 12px 30px rgba(0,0,0,0.35)', animation: 'fadeUp 0.25s ease', maxWidth: 320,
    }}>
      {message}
    </div>
  );
}

function Sidebar({ view, setView, unreadCount, inboxUnread }) {
  const badges = { messages: unreadCount, inbox: inboxUnread };
  const { user, logout } = useAuth();

  // Which parent items (with children) are expanded. A parent auto-opens
  // whenever the active view belongs to one of its children.
  const [openIds, setOpenIds] = useState(() => {
    const initial = {};
    NAV_GROUPS.forEach((g) => g.items.forEach((it) => {
      if (it.children && it.children.some((c) => c.id === view)) initial[it.id] = true;
    }));
    return initial;
  });

  useEffect(() => {
    NAV_GROUPS.forEach((g) => g.items.forEach((it) => {
      if (it.children && it.children.some((c) => c.id === view)) {
        setOpenIds((prev) => (prev[it.id] ? prev : { ...prev, [it.id]: true }));
      }
    }));
  }, [view]);

  const toggle = (id) => setOpenIds((prev) => ({ ...prev, [id]: !prev[id] }));

  const initials = (user?.name || '?').split(' ').map(s => s[0]).slice(0, 2).join('').toUpperCase();
  return (
    <div style={{ width: 220, background: SURFACE, minHeight: '100%', padding: '22px 12px', boxSizing: 'border-box', flexShrink: 0, display: 'flex', flexDirection: 'column', borderRight: `1px solid ${LINE}` }}>

      </div>
      <div style={{ flex: 1, overflowY: 'auto' }}>
        {NAV_GROUPS.map((group, gi) => (
          <div key={group.label} style={{ marginBottom: 14 }}>
            <div style={{
              fontSize: 10.5, fontWeight: 700, color: MUTED, letterSpacing: 0.8, textTransform: 'uppercase',
              padding: '0 11px', marginBottom: 6, marginTop: gi === 0 ? 0 : 6,
            }}>
              {group.label}
            </div>
            {group.items.map((it) => {
              const hasChildren = !!it.children;
              const childActive = hasChildren && it.children.some((c) => c.id === view);
              const active = view === it.id || childActive;
              const isOpen = hasChildren && !!openIds[it.id];
              const badge = it.badgeKey ? (badges[it.badgeKey] || 0) : 0;
              return (
                <div key={it.id}>
                  <button
                    onClick={() => (hasChildren ? toggle(it.id) : setView(it.id))}
                    style={{
                      display: 'flex', alignItems: 'center', gap: 10, width: '100%', textAlign: 'left',
                      background: active ? JADE_LIGHT : 'transparent',
                      color: active ? JADE : '#9fb0a8',
                      border: 'none', borderRadius: 8, padding: '10px 11px', marginBottom: 2,
                      fontSize: 13.5, fontWeight: 500, cursor: 'pointer', fontFamily: 'Inter, sans-serif',
                      borderLeft: active ? `2.5px solid ${JADE}` : '2.5px solid transparent',
                      transition: '0.12s',
                    }}
                  >
                    <span style={{ fontSize: 16 }}>{it.icon}</span>
                    <span style={{ flex: 1 }}>{it.label}</span>
                    {!!badge && (
                      <span style={{ background: RUST, color: '#fff', fontSize: 10, fontWeight: 700, borderRadius: 999, minWidth: 17, height: 17, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 4px' }}>
                        {badge > 9 ? '9+' : badge}
                      </span>
                    )}
                    {hasChildren && (
                      <span style={{
                        fontSize: 11, color: active ? JADE : MUTED, transform: isOpen ? 'rotate(90deg)' : 'rotate(0deg)',
                        transition: 'transform 0.15s ease', display: 'inline-block',
                      }}>
                        ›
                      </span>
                    )}
                  </button>

                    <div style={{ margin: '2px 0 4px 20px', borderLeft: `1px solid ${LINE}`, paddingLeft: 12 }}>
                      {it.children.map((c) => {

                              background: cActive ? JADE : '#4c5f56',
                            }} />
                            <span>{c.label}</span>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        ))}
      </div>
      <button onClick={() => setView('profile')} style={{
        borderTop: `1px solid ${LINE}`, paddingTop: 12, display: 'flex', alignItems: 'center', gap: 9,

        <div style={{ width: 32, height: 32, borderRadius: '50%', background: `linear-gradient(135deg, ${GOLD}, ${GOLD_DARK})`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, color: '#1a1305', flexShrink: 0 }}>

  const contactName = (id) => data.contacts.find(c => c.id === id)?.name || '—';

        <StatCard label="Active deals" value={activeDeals.length} accent={SKY} />
        <StatCard label="Closed won" value={money(closedWonValue)} accent={JADE} />
        <StatCard label="Listings" value={data.properties.filter(p => p.status === 'Available').length} accent={GOLD} />

      <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
        <div style={{ flex: '1 1 300px', background: CARD, border: `1px solid ${LINE}`, borderRadius: 12, padding: 16 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
            <div style={{ fontFamily: 'Fraunces, serif', fontSize: 16, fontWeight: 600, color: INK }}>Recent leads</div>
            <button onClick={() => setView('leads')} style={{ background: 'none', border: 'none', color: GOLD, fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>View all</button>
          </div>
          {recentLeads.length === 0 && <div style={{ fontSize: 12.5, color: MUTED, padding: '6px 0' }}>No leads yet.</div>}
          {recentLeads.map(c => (
            <div key={c.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '7px 0', borderTop: `1px solid ${LINE}` }}>
              <div><div style={{ fontSize: 13, fontWeight: 600, color: INK }}>{c.name}</div><div style={{ fontSize: 11, color: SLATE }}>{c.source}</div></div>
              <Badge text={c.status} bg={LEAD_STATUS_COLOR[c.status].bg} fg={LEAD_STATUS_COLOR[c.status].fg} />
            </div>
          ))}
        </div>
        <div style={{ flex: '1 1 300px', background: CARD, border: `1px solid ${LINE}`, borderRadius: 12, padding: 16 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
            <div style={{ fontFamily: 'Fraunces, serif', fontSize: 16, fontWeight: 600, color: INK }}>Upcoming tasks</div>
            <button onClick={() => setView('tasks')} style={{ background: 'none', border: 'none', color: GOLD, fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>View all</button>
          </div>
          {pendingTasks.length === 0 && <div style={{ fontSize: 12.5, color: MUTED, padding: '6px 0' }}>All caught up 🎉</div>}
          {pendingTasks.slice(0, 4).map(t => {
            const d = daysFrom(t.dueDate);
            return (
              <div key={t.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '7px 0', borderTop: `1px solid ${LINE}` }}>
                <div><div style={{ fontSize: 13, fontWeight: 600, color: INK }}>{t.title}</div><div style={{ fontSize: 11, color: SLATE }}>{contactName(t.contactId)}</div></div>
                <span style={{ fontSize: 11, fontWeight: 600, color: d < 0 ? RUST : d === 0 ? GOLD : SLATE }}>{d < 0 ? `${Math.abs(d)}d overdue` : d === 0 ? 'Today' : `in ${d}d`}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

//  PIPELINE
// ─────────────────────────────────────────────────────────────
function Pipeline({ data, actions }) {
  const [modal, setModal] = useState(null);
  const [saving, setSaving] = useState(false);
  const contactName = id => data.contacts.find(c => c.id === id)?.name || 'Unknown';
  const propertyTitle = id => data.properties.find(p => p.id === id)?.title || 'Unknown';
  const saveDeal = async (f) => {
    setSaving(true);
    try {
      if (modal.editing) await actions.updateDeal(modal.editing.id, f);
      else await actions.createDeal(f);
      setModal(null);
    } finally { setSaving(false); }
  };
  const removeDeal = (id) => actions.deleteDeal(id);
  const setStage = (id, stage) => actions.updateDeal(id, { stage });
  if (data.contacts.length === 0 || data.properties.length === 0) return <div><h1 style={{ fontFamily: 'Fraunces, serif', fontSize: 24, color: INK }}>Pipeline</h1><p style={{ color: SLATE }}>Add leads and listings first.</p></div>;
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16, flexWrap: 'wrap', gap: 8 }}>
        <div><h1 style={{ fontFamily: 'Fraunces, serif', fontSize: 24, fontWeight: 600, color: INK, margin: '0 0 2px' }}>Pipeline</h1><p style={{ color: SLATE, fontSize: 13, margin: 0 }}>{data.deals.length} deals</p></div>
        <PrimaryBtn onClick={() => setModal({ editing: null })}>➕ New deal</PrimaryBtn>
      </div>
      <div style={{ display: 'flex', gap: 12, overflowX: 'auto', paddingBottom: 8 }}>
        {DEAL_STAGES.map(stage => {
          const stageDeals = data.deals.filter(d => d.stage === stage);
          return (
            <div key={stage} style={{ minWidth: 220, flex: '0 0 220px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}><span style={{ width: 8, height: 8, borderRadius: 8, background: stage === 'Closed Won' ? JADE : stage === 'Closed Lost' ? RUST : GOLD }}></span><div style={{ fontFamily: 'Fraunces, serif', fontSize: 14, fontWeight: 600, color: INK }}>{stage}</div><span style={{ fontSize: 11, color: SLATE }}>({stageDeals.length})</span></div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {stageDeals.map(d => (
                  <div key={d.id} style={{ background: CARD, border: `1px solid ${LINE}`, borderRadius: 10, padding: 12 }}>
                    <div style={{ fontWeight: 600, fontSize: 13, color: INK }}>{contactName(d.contactId)}</div>
                    <div style={{ fontSize: 11, color: SLATE, marginBottom: 4 }}>{propertyTitle(d.propertyId)}</div>
                    <div style={{ fontFamily: 'Fraunces, serif', fontSize: 15, fontWeight: 600, color: GOLD }}>{money(d.value)}</div>
                    <select value={d.stage} onChange={e => setStage(d.id, e.target.value)} style={{ ...inputStyle, fontSize: 11, padding: '4px 6px', margin: '6px 0' }}>{DEAL_STAGES.map(s => <option key={s}>{s}</option>)}</select>
                    <div style={{ display: 'flex', gap: 4, justifyContent: 'flex-end' }}><IconBtn title="Edit" onClick={() => setModal({ editing: d })}>✏️</IconBtn><IconBtn title="Delete" danger onClick={() => removeDeal(d.id)}>🗑️</IconBtn></div>
                  </div>
                ))}
                {stageDeals.length === 0 && <div style={{ fontSize: 11, color: MUTED, padding: '4px 2px' }}>—</div>}
              </div>
            </div>
          );
        })}

function Tasks({ data, actions }) {

      else await actions.createTask(f);
      setModal(null);
    } finally { setSaving(false); }

  const toggleDone = (t) => actions.updateTask(t.id, { done: !t.done });
  const removeTask = (id) => actions.deleteTask(id);
  const pending = data.tasks.filter(t => !t.done).sort((a,b) => (a.dueDate||'').localeCompare(b.dueDate||''));

  const Row = ({ t }) => {

        {pending.length === 0 && <div style={{ padding: 16, color: MUTED, fontSize: 13 }}>All done 🎉</div>}
        {pending.map(t => <Row key={t.id} t={t} />)}

      {modal && <Modal title={modal.editing ? 'Edit task' : 'Add task'} onClose={() => setModal(null)}>

const ACTIVITY_ICON = { lead: '👤', property: '🏠', deal: '📌', task: '✅', system: '🔔' };

function timeAgo(iso) {
  if (!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.round(hrs / 24);
  if (days < 30) return `${days}d ago`;
  return new Date(iso).toLocaleDateString();
}

function Profile() {
  const { user, setUser, token, logout } = useAuth();
  const [form, setForm] = useState({ name: user?.name || '', agency: user?.agency || '' });
  const [pwForm, setPwForm] = useState({ currentPassword: '', newPassword: '', confirmPassword: '' });
  const [savingProfile, setSavingProfile] = useState(false);
  const [savingPw, setSavingPw] = useState(false);
  const [msg, setMsg] = useState(null); // { kind, text }

  const set = k => e => setForm({ ...form, [k]: e.target.value });
  const setPw = k => e => setPwForm({ ...pwForm, [k]: e.target.value });
  const initials = (user?.name || '?').split(' ').map(s => s[0]).slice(0, 2).join('').toUpperCase();

  const saveProfile = async (e) => {
    e.preventDefault();
    setMsg(null);
    if (!form.name.trim()) return setMsg({ kind: 'error', text: 'Name is required.' });
    setSavingProfile(true);
    try {
      const res = await api.updateProfile(token, form);
      setUser(res.user);
      setMsg({ kind: 'success', text: 'Profile updated.' });
    } catch (err) {
      setMsg({ kind: 'error', text: err.message });
    } finally {
      setSavingProfile(false);
    }
  };

  const savePassword = async (e) => {
    e.preventDefault();
    setMsg(null);
    if (pwForm.newPassword.length < 6) return setMsg({ kind: 'error', text: 'New password must be at least 6 characters.' });
    if (pwForm.newPassword !== pwForm.confirmPassword) return setMsg({ kind: 'error', text: 'New passwords do not match.' });
    setSavingPw(true);
    try {
      await api.changePassword(token, { currentPassword: pwForm.currentPassword, newPassword: pwForm.newPassword });
      setPwForm({ currentPassword: '', newPassword: '', confirmPassword: '' });
      setMsg({ kind: 'success', text: 'Password changed.' });
    } catch (err) {
      setMsg({ kind: 'error', text: err.message });
    } finally {
      setSavingPw(false);
    }
  };

  return (
    <div>
      <h1 style={{ fontFamily: 'Fraunces, serif', fontSize: 24, fontWeight: 600, color: INK, margin: '0 0 2px' }}>Profile</h1>
      <p style={{ color: SLATE, fontSize: 13, margin: '0 0 20px' }}>Manage your account details and security.</p>

      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 22 }}>
        <div style={{ width: 56, height: 56, borderRadius: '50%', background: `linear-gradient(135deg, ${GOLD}, ${GOLD_DARK})`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, fontWeight: 700, color: '#1a1305' }}>
          {initials}
        </div>
        <div>
          <div style={{ fontFamily: 'Fraunces, serif', fontSize: 18, fontWeight: 600, color: INK }}>{user?.name}</div>
          <div style={{ fontSize: 12.5, color: SLATE }}>{user?.email}</div>
          <div style={{ fontSize: 11, color: MUTED, marginTop: 2 }}>Member since {user?.createdAt ? new Date(user.createdAt).toLocaleDateString() : '—'}</div>
        </div>
      </div>

      {msg && (
        <div style={{
          background: msg.kind === 'error' ? RUST_LIGHT : JADE_LIGHT, color: msg.kind === 'error' ? RUST : JADE,
          fontSize: 12.5, fontWeight: 600, borderRadius: 8, padding: '9px 12px', marginBottom: 16, maxWidth: 460,
        }}>
          {msg.text}
        </div>
      )}

      <div style={{ display: 'flex', gap: 20, flexWrap: 'wrap' }}>
        <form onSubmit={saveProfile} style={{ flex: '1 1 320px', background: CARD, border: `1px solid ${LINE}`, borderRadius: 12, padding: 18, maxWidth: 420 }}>
          <div style={{ fontFamily: 'Fraunces, serif', fontSize: 16, fontWeight: 600, color: INK, marginBottom: 12 }}>Account details</div>
          <Field label="Full name"><input style={inputStyle} value={form.name} onChange={set('name')} /></Field>
          <Field label="Agency"><input style={inputStyle} value={form.agency} onChange={set('agency')} placeholder="e.g. Fahmin Realty" /></Field>
          <Field label="Email"><input style={{ ...inputStyle, opacity: 0.6, cursor: 'not-allowed' }} value={user?.email || ''} disabled /></Field>
          <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 6 }}>
            <PrimaryBtn disabled={savingProfile}>{savingProfile ? 'Saving…' : 'Save changes'}</PrimaryBtn>

        </form>

        <form onSubmit={savePassword} style={{ flex: '1 1 320px', background: CARD, border: `1px solid ${LINE}`, borderRadius: 12, padding: 18, maxWidth: 420 }}>
          <div style={{ fontFamily: 'Fraunces, serif', fontSize: 16, fontWeight: 600, color: INK, marginBottom: 12 }}>Change password</div>

            </div>
            <div style={{ display: 'flex', gap: 6 }}>
              <PrimaryBtn onClick={() => complete(call)} style={{ padding: '7px 12px', fontSize: 12.5 }}>Complete</PrimaryBtn>
              <IconBtn onClick={() => remove(call)} title="Delete" danger>✕</IconBtn>
            </div>
          </div>
        ))}

        {calls.some(c => c.status === 'completed') && (
          <>
            <div style={{ fontSize: 11, color: MUTED, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.4, marginTop: 18, marginBottom: 8 }}>Completed</div>
            {calls.filter(c => c.status === 'completed').slice(-6).reverse().map(call => (
              <div key={call.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderTop: `1px solid ${LINE}` }}>
                <div style={{ fontSize: 12.5, color: SLATE }}>{contactName(call.contactId)}</div>
                <Badge text="Completed" bg={JADE_LIGHT} fg={JADE} />
              </div>
            ))}
          </>
        )}
      </div>

      {showModal && (
        <ScheduleCallModal
          contacts={data.contacts}
          onClose={() => setShowModal(false)}
          onSave={(body) => actions.createCall(body)}
        />
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
//  INBOX — unified per-lead conversation threads
// ─────────────────────────────────────────────────────────────
function Inbox({ data, actions }) {
  const { token } = useAuth();
  const conversations = data.conversations || [];
  const [selected, setSelected] = useState(conversations[0]?.contactId || null);
  const [messages, setMessages] = useState([]);
  const [loadingThread, setLoadingThread] = useState(false);
  const [draft, setDraft] = useState('');
  const [sending, setSending] = useState(false);
  const scrollRef = useRef(null);

  const contactName = (id) => data.contacts.find(c => c.id === id)?.name || conversations.find(c => c.contactId === id)?.contactName || 'Lead';

  const openThread = async (contactId) => {
    setSelected(contactId);
    setLoadingThread(true);
    try {
      const rows = await api.thread(token, contactId);
      setMessages(rows);
    } catch (e) { /* toast handled at data-load level; keep thread empty on failure */ }
    finally { setLoadingThread(false); }
    actions.refreshConversations();
  };

  useEffect(() => { if (selected) openThread(selected); }, []);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages]);

  const send = async (e) => {
    e.preventDefault();
    if (!draft.trim() || !selected) return;
    setSending(true);
    try {
      const msg = await api.sendMessage(token, selected, { body: draft.trim() });
      setMessages(m => [...m, msg]);
      setDraft('');
      actions.refreshConversations();
    } finally {
      setSending(false);
    }
  };

  return (
    <div>
      <h1 style={{ fontFamily: 'Fraunces, serif', fontSize: 24, fontWeight: 600, color: INK, margin: '0 0 2px' }}>Inbox</h1>
      <p style={{ color: SLATE, fontSize: 13, margin: '0 0 16px' }}>Unified conversations with your leads.</p>

      <div style={{ display: 'flex', border: `1px solid ${LINE}`, borderRadius: 12, overflow: 'hidden', height: 480, background: CARD }}>
        <div style={{ width: 230, borderRight: `1px solid ${LINE}`, overflowY: 'auto', flexShrink: 0 }}>
          {conversations.length === 0 && <div style={{ fontSize: 12, color: MUTED, padding: 16 }}>No conversations yet.</div>}
          {conversations.map(c => (
            <button key={c.contactId} onClick={() => openThread(c.contactId)} style={{
              display: 'block', width: '100%', textAlign: 'left', background: selected === c.contactId ? JADE_LIGHT : 'transparent',
              border: 'none', borderBottom: `1px solid ${LINE}`, padding: '11px 14px', cursor: 'pointer', fontFamily: 'Inter, sans-serif',
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: selected === c.contactId ? JADE : INK }}>{c.contactName}</span>
                {!!c.unread && <span style={{ background: RUST, color: '#fff', fontSize: 9.5, fontWeight: 700, borderRadius: 999, minWidth: 16, height: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 3px' }}>{c.unread}</span>}
              </div>
              <div style={{ fontSize: 11.5, color: SLATE, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', marginTop: 2 }}>{c.lastMessage}</div>
            </button>
          ))}
        </div>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
          {!selected && <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: MUTED, fontSize: 13 }}>Select a conversation</div>}
          {selected && (
            <>
              <div style={{ padding: '12px 16px', borderBottom: `1px solid ${LINE}` }}>
                <div style={{ fontSize: 14, fontWeight: 600, color: INK }}>{contactName(selected)}</div>
                <div style={{ fontSize: 11, color: SLATE }}>WhatsApp conversation</div>
              </div>
              <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto', padding: 16, display: 'flex', flexDirection: 'column', gap: 8 }}>
                {loadingThread && <div style={{ fontSize: 12, color: MUTED }}>Loading…</div>}
                {!loadingThread && messages.length === 0 && <div style={{ fontSize: 12, color: MUTED }}>No messages yet — say hello.</div>}
                {messages.map(m => (
                  <div key={m.id} style={{
                    maxWidth: '70%', alignSelf: m.sender === 'agent' ? 'flex-end' : 'flex-start',
                    background: m.sender === 'agent' ? `linear-gradient(135deg, ${JADE}, ${JADE_DARK})` : SURFACE,
                    color: m.sender === 'agent' ? '#08150f' : INK,
                    border: m.sender === 'agent' ? 'none' : `1px solid ${LINE}`,
                    borderRadius: 12, padding: '8px 12px', fontSize: 13,
                  }}>
                    {m.body}
                  </div>
                ))}
              </div>
              <form onSubmit={send} style={{ display: 'flex', gap: 8, padding: 12, borderTop: `1px solid ${LINE}` }}>
                <input style={{ ...inputStyle, flex: 1 }} placeholder="Write a message…" value={draft} onChange={e => setDraft(e.target.value)} />
                <PrimaryBtn disabled={sending || !draft.trim()}>Send</PrimaryBtn>
              </form>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
//  DATA HOOK — fetches from the API and exposes CRUD actions
// ─────────────────────────────────────────────────────────────
function useCrmData(token) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState(null);

  const load = useCallback(() => {
    if (!token) return;
    setLoading(true);
    api.all(token)
      .then(setData)
      .catch((err) => setToast({ message: err.message, kind: 'error' }))
      .finally(() => setLoading(false));
  }, [token]);

  useEffect(() => { load(); }, [load]);

  const wrap = (fn) => async (...args) => {
    try {
      return await fn(...args);
    } catch (err) {
      setToast({ message: err.message || 'Something went wrong', kind: 'error' });
      throw err;
    }
  };

  const refreshActivities = async () => {
    try {
      const activities = await api.activities(token);
      setData(d => (d ? { ...d, activities } : d));
    } catch (e) { /* non-critical */ }
  };

  const actions = {
    createContact: wrap(async (body) => { const c = await api.createContact(token, body); setData(d => ({ ...d, contacts: [...d.contacts, c] })); await refreshActivities(); }),
    updateContact: wrap(async (id, body) => { const c = await api.updateContact(token, id, body); setData(d => ({ ...d, contacts: d.contacts.map(x => x.id === id ? c : x) })); }),
    deleteContact: wrap(async (id) => { await api.deleteContact(token, id); setData(d => ({ ...d, contacts: d.contacts.filter(x => x.id !== id), deals: d.deals.filter(x => x.contactId !== id), tasks: d.tasks.filter(x => x.contactId !== id) })); }),
    createProperty: wrap(async (body) => { const p = await api.createProperty(token, body); setData(d => ({ ...d, properties: [...d.properties, p] })); await refreshActivities(); }),
    updateProperty: wrap(async (id, body) => { const p = await api.updateProperty(token, id, body); setData(d => ({ ...d, properties: d.properties.map(x => x.id === id ? p : x) })); }),
    deleteProperty: wrap(async (id) => { await api.deleteProperty(token, id); setData(d => ({ ...d, properties: d.properties.filter(x => x.id !== id), deals: d.deals.filter(x => x.propertyId !== id) })); }),
    createDeal: wrap(async (body) => { const deal = await api.createDeal(token, body); setData(d => ({ ...d, deals: [...d.deals, deal] })); await refreshActivities(); }),
    updateDeal: wrap(async (id, body) => { const deal = await api.updateDeal(token, id, body); setData(d => ({ ...d, deals: d.deals.map(x => x.id === id ? deal : x) })); if (body.stage) await refreshActivities(); }),
    deleteDeal: wrap(async (id) => { await api.deleteDeal(token, id); setData(d => ({ ...d, deals: d.deals.filter(x => x.id !== id) })); }),
    createTask: wrap(async (body) => { const t = await api.createTask(token, body); setData(d => ({ ...d, tasks: [...d.tasks, t] })); }),
    updateTask: wrap(async (id, body) => { const t = await api.updateTask(token, id, body); setData(d => ({ ...d, tasks: d.tasks.map(x => x.id === id ? t : x) })); if (body.done) await refreshActivities(); }),
    deleteTask: wrap(async (id) => { await api.deleteTask(token, id); setData(d => ({ ...d, tasks: d.tasks.filter(x => x.id !== id) })); }),
    markActivityRead: wrap(async (id) => { const a = await api.markActivityRead(token, id); setData(d => ({ ...d, activities: d.activities.map(x => x.id === id ? a : x) })); }),
    markAllActivitiesRead: wrap(async () => { await api.markAllActivitiesRead(token); setData(d => ({ ...d, activities: d.activities.map(x => ({ ...x, read: true })) })); }),
    deleteActivity: wrap(async (id) => { await api.deleteActivity(token, id); setData(d => ({ ...d, activities: d.activities.filter(x => x.id !== id) })); }),
    createCall: wrap(async (body) => { const c = await api.createCall(token, body); setData(d => ({ ...d, calls: [...d.calls, c] })); }),
    updateCall: wrap(async (id, body) => { const c = await api.updateCall(token, id, body); setData(d => ({ ...d, calls: d.calls.map(x => x.id === id ? c : x) })); }),
    deleteCall: wrap(async (id) => { await api.deleteCall(token, id); setData(d => ({ ...d, calls: d.calls.filter(x => x.id !== id) })); }),
    refreshConversations: wrap(async () => { const conversations = await api.conversations(token); setData(d => (d ? { ...d, conversations } : d)); }),
  };

  return { data, loading, actions, toast, clearToast: () => setToast(null) };
}

// ─────────────────────────────────────────────────────────────
//  CRM SHELL — rendered once authenticated
// ─────────────────────────────────────────────────────────────
function CrmShell() {
  const { token } = useAuth();
  const { data, loading, actions, toast, clearToast } = useCrmData(token);
  const [view, setView] = useState('dashboard');

  if (loading || !data) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', color: SLATE, fontFamily: 'Inter, sans-serif' }}>
        Loading your workspace…
      </div>
    );
  }

  const unreadCount = (data.activities || []).filter(a => !a.read).length;
  const inboxUnread = (data.conversations || []).reduce((s, c) => s + (c.unread || 0), 0);

  return (
    <div style={{ fontFamily: 'Inter, sans-serif', display: 'flex', minHeight: 640, background: SURFACE, borderRadius: 16, overflow: 'hidden', border: `1px solid ${LINE}`, boxShadow: '0 30px 80px rgba(0,0,0,0.35)' }}>
      <Sidebar view={view} setView={setView} unreadCount={unreadCount} inboxUnread={inboxUnread} />
      <div style={{ flex: 1, padding: '22px 28px', overflowX: 'hidden' }}>
        <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 14 }}>
          <NotificationBell unreadCount={unreadCount} onOpen={() => setView('messages')} />
        </div>
        {view === 'dashboard' && <Dashboard data={data} setView={setView} />}
        {view === 'leads' && <Leads data={data} actions={actions} />}
        {view === 'properties' && <Properties data={data} actions={actions} />}
        {view === 'pipeline' && <Pipeline data={data} actions={actions} />}
        {view === 'tasks' && <Tasks data={data} actions={actions} />}
        {view === 'analytics' && <Analytics data={data} />}
        {view === 'messages' && <Messages data={data} actions={actions} />}
        {view === 'calls' && <Calls data={data} actions={actions} />}
        {view === 'inbox' && <Inbox data={data} actions={actions} />}
        {view === 'assistant' && <AIAssistant data={data} />}
        {view === 'settings' && <Settings data={data} />}
        {view === 'profile' && <Profile />}
      </div>
      <Toast message={toast?.message} kind={toast?.kind} onClose={clearToast} />
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
//  APP — gates on auth state
// ─────────────────────────────────────────────────────────────
function App() {
  const { token, user, checking } = useAuth();

  if (checking) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', color: SLATE, fontFamily: 'Inter, sans-serif' }}>
        Loading…
      </div>
    );
  }
  if (!token || !user) return <AuthScreen />;
  return <CrmShell />;
}

function Root() {
  return (
    <AuthProvider>
      <App />
    </AuthProvider>
  );
}
